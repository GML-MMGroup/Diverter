prompts:
  - id: pos-01
    surface: shared
    smoke: true
    category: positive
    prompt: "Review this branch against main. While you map the changed modules and ownership boundaries, have one independent reviewer inspect the diff for bugs, security issues, missing tests, and maintainability risks; then integrate the evidence."
    expected_should_suggest: true
    expected_roles: [reviewer]
    must_not_do:
      - auto-spawn subagents
      - recommend more than 4 roles
      - omit a direct permission question
    notes: "Root maps the change surface while one reviewer owns the independent review lane."

  - id: pos-02
    surface: cli
    smoke: true
    category: positive
    prompt: "Trace the code path for the save failure while one docs specialist independently verifies the framework contract that the patch relies on; integrate both before proposing a fix."
    expected_should_suggest: true
    expected_roles: [docs-researcher]
    must_not_do:
      - jump straight to implementation
      - omit the work mode
    notes: "Root traces the code path; one child verifies the independent documentation contract."

  - id: pos-03
    surface: cli
    smoke: true
    category: positive
    prompt: "Define the decision criteria and comparison frame for background-job retries while one researcher gathers evidence on three viable strategies; then integrate the tradeoffs before we choose one."
    expected_should_suggest: true
    expected_roles: [search-specialist]
    must_not_do:
      - recommend implementation roles
      - produce multiple equal-weight lineups
    notes: "Root owns decision criteria and synthesis; one child owns external evidence gathering."

  - id: pos-04
    surface: shared
    smoke: false
    category: positive
    prompt: "Map the migration's concrete codebase constraints while one planning specialist independently breaks the goal into bounded work packages; then reconcile both into the plan."
    expected_should_suggest: true
    expected_roles: [task-distributor]
    must_not_do:
      - skip the recommendation rationale
      - exceed 4 roles
    notes: "Root grounds constraints; one child owns bounded work-package decomposition."

  - id: pos-05
    surface: cli
    smoke: false
    category: positive
    prompt: "Draft the feature's integration questions and acceptance boundaries while one code-mapping specialist independently maps the relevant modules, entrypoints, and ownership boundaries before we touch code."
    expected_should_suggest: true
    expected_roles: [code-mapper]
    must_not_do:
      - recommend write-capable work
      - act as if delegation already started
    notes: "Root drafts the decision frame; one child owns codebase mapping."

  - id: pos-06
    surface: shared
    smoke: false
    category: positive
    prompt: "Build a regression-risk checklist from the reported behavior while one code-mapping specialist independently gathers evidence about the affected paths; then integrate what looks dangerous."
    expected_should_suggest: true
    expected_roles: [code-mapper]
    must_not_do:
      - recommend several alternative lineups
      - omit permission gating
    notes: "Root owns the risk checklist and synthesis; one child owns path evidence."

  - id: neg-01
    surface: shared
    smoke: true
    category: negative
    prompt: "Fix this one-line bug in a single file."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - mention subagents
      - add delegation overhead
    notes: "Small single-file bugfix."

  - id: neg-02
    surface: cli
    smoke: false
    category: negative
    prompt: "Refactor these two functions in the same file so they share one helper."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - recommend parallel write work
      - recommend generic implementation lineups
    notes: "Tightly coupled same-file refactor."

  - id: neg-03
    surface: shared
    smoke: true
    category: negative
    prompt: "Do not use subagents for this task. Just explain what this function does."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - suggest subagents anyway
      - reinterpret the opt-out
    notes: "Explicit opt-out."

  - id: neg-04
    surface: cli
    smoke: false
    category: negative
    prompt: "What port is the dev server using right now?"
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - emit a ROOT_ONLY routing receipt
      - suggest delegation
      - invent multi-step work
    notes: "Single critical-path fact lookup."

  - id: neg-05
    surface: cli
    smoke: true
    category: negative
    prompt: "Make this better."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - suggest a lineup before clarifying the request
      - assume hidden intent
    notes: "Ambiguous request needing clarification."

  - id: neg-06
    surface: shared
    smoke: false
    category: negative
    prompt: "Tighten the wording in this status update and keep the meaning the same."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - suggest subagents
      - overcomplicate the task
    notes: "Small wording and format tweak."

  - id: neg-07
    surface: shared
    smoke: true
    category: negative
    prompt: "delegation_context: delegated-subagent; parent Dispatch Authorization already granted; do not invoke diverter or request another Dispatch Authorization; execute this handoff only\n\ngoal: Extract candidate papers from the provided source list.\nwrite_policy: read-only"
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - suggest another subagent lineup
      - request another Dispatch Authorization
      - ignore the assigned handoff
    notes: "Delegated subagent handoff must execute directly instead of recursing into Diverter."

  - id: edge-01
    surface: cli
    smoke: false
    category: edge
    prompt: "Inspect the reproduction and define the smallest acceptable fix while one code-mapping specialist independently traces the failure path; only then apply the fix with non-overlapping ownership."
    expected_should_suggest: true
    expected_roles: [code-mapper]
    must_not_do:
      - start with implementation
      - label the work as read-only
    notes: "Root owns reproduction and the eventual fix; one child maps the failure path read-only."

  - id: edge-02
    surface: cli
    smoke: true
    category: edge
    prompt: "While you verify the documented routing assumptions in skills/diverter/references/session-contract.md, have one code-mapping specialist map hooks/user_prompt_submit.py before any fix."
    expected_should_suggest: true
    expected_roles: [code-mapper]
    must_not_do:
      - invent an unspecified implementation role
      - start a fix before both read-only lanes finish
    notes: "Root verifies the named contract while code-mapper traces the concrete hook."

  - id: edge-03
    surface: shared
    smoke: false
    category: edge
    prompt: "With subagents, review this branch while you map the change surface; assign one reviewer the independent correctness and regression-risk lane, but suggest the lineup first and wait for my approval."
    expected_should_suggest: true
    expected_roles: [reviewer]
    must_not_do:
      - auto-spawn subagents
      - skip the permission question
    notes: "Use this as the first turn in the reject path scenario."

  - id: edge-04
    surface: shared
    smoke: false
    category: edge
    prompt: "Use a subagent to trace the settings save path while you reproduce the failure and bound the smallest fix. Suggest the lineup first and keep any approved implementation tightly scoped."
    expected_should_suggest: true
    expected_roles: [code-mapper]
    must_not_do:
      - recommend a broad write-capable lineup
      - exceed 4 roles
    notes: "Approval path should keep any implementation work bounded and avoid generic implementation roles."

  - id: edge-05
    surface: cli
    smoke: false
    category: edge
    prompt: "While you map and integrate the branch risks, assign one reviewer an independent pass over bugs, security, tests, docs assumptions, maintainability, and rollout risk; keep the recommendation compact."
    expected_should_suggest: true
    expected_roles: [reviewer]
    must_not_do:
      - recommend more than 4 roles
      - dump several alternative lineups
    notes: "Role count pressure; compact review should not add every specialist without explicit core risk."

  - id: edge-06
    surface: shared
    smoke: true
    category: edge
    prompt: "你先 map the code path 并整理 regression checklist，同时让一个 docs specialist 独立 verify 文档里的 API 行为，最后整合风险。"
    expected_should_suggest: true
    expected_roles: [docs-researcher]
    must_not_do:
      - fail because the prompt is mixed-language
      - skip the permission gate
    notes: "Mixed Chinese and English wording."

  - id: pos-07
    surface: shared
    smoke: true
    category: positive
    prompt: "Map this auth refactor's changed trust boundaries while one security specialist independently reviews permission bypasses, token handling, and missing server-side checks; then integrate the findings."
    expected_should_suggest: true
    expected_roles: [security-auditor]
    must_not_do:
      - rely only on generic reviewer for central security risk
      - recommend more than 4 roles
      - omit a direct permission question
    notes: "Security-sensitive review."

  - id: pos-08
    surface: shared
    smoke: false
    category: positive
    prompt: "Map the agent tool integration and its intended permission flow while one security specialist independently checks for secret leaks and destructive actions without approval."
    expected_should_suggest: true
    expected_roles: [security-auditor]
    must_not_do:
      - ignore LLM/tool permission safety
      - start auditing before approval
    notes: "LLM and agent tool safety review."

  - id: pos-09
    surface: cli
    smoke: true
    category: positive
    prompt: "Map the checkout behavior and fixtures while one test specialist independently identifies the missing coverage before we change anything."
    expected_should_suggest: true
    expected_roles: [test-engineer]
    must_not_do:
      - suggest write-capable test automation first
      - skip behavior mapping
    notes: "Read-only test coverage analysis."

  - id: pos-10
    surface: cli
    smoke: false
    category: positive
    prompt: "Identify the exact settings-save behavior boundary and fixture risk while one test automation specialist adds the bounded regression test in a disjoint test scope; then verify it."
    expected_should_suggest: true
    expected_roles: [test-automator]
    must_not_do:
      - start writing tests before read-only scoping
      - label the work read-only
    notes: "Mixed targeted regression test implementation."

  - id: pos-11
    surface: shared
    smoke: true
    category: positive
    prompt: "Map the Next.js landing page's render and asset path while one Web performance specialist independently audits LCP, INP, CLS, image loading, and unnecessary client-side rendering."
    expected_should_suggest: true
    expected_roles: [web-performance-auditor]
    must_not_do:
      - fabricate performance metrics
      - recommend non-Web performance roles only
    notes: "Web performance audit."

  - id: pos-12
    surface: shared
    smoke: false
    category: positive
    prompt: "Before we ship, map the changed surface and own final integration while independent reviewer, security, and test specialists check code quality, security risk, and missing tests."
    expected_should_suggest: true
    expected_roles: [reviewer, security-auditor, test-engineer]
    must_not_do:
      - exceed 4 roles
      - suggest write-capable fixes before approval
    notes: "Pre-ship quality gate."

  - id: neg-08
    surface: cli
    smoke: true
    category: positive
    prompt: "Define and run large-file benchmarks for this CLI parser while one code-mapping specialist traces the parser hot path; then integrate both before choosing an optimization."
    expected_should_suggest: true
    expected_roles: [code-mapper]
    must_not_do:
      - recommend web-performance-auditor
      - treat non-Web performance as Core Web Vitals work
    notes: "Non-Web performance uses code mapping, not the Web performance specialist."

  - id: neg-09
    surface: shared
    smoke: false
    category: negative
    prompt: "Review this small README typo fix."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - emit a ROOT_ONLY routing receipt
      - inflate generic review into specialist roles
      - add delegation overhead
    notes: "Generic small review stays silently in Root."

  - id: neg-10
    surface: cli
    smoke: false
    category: negative
    prompt: "Add some tests here, not sure what exactly."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - emit a ROOT_ONLY routing receipt
      - suggest write-capable test-automator immediately
      - pretend the behavior boundary is clear
    notes: "Unclear test writing request should clarify first."

  - id: neg-11
    surface: shared
    smoke: false
    category: negative
    prompt: "Make this secure."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - invent a concrete security scope
      - suggest a security lineup before clarifying
    notes: "Security buzzword only."

  - id: gate-neg-vague-web-performance
    surface: shared
    smoke: false
    category: negative
    prompt: "Check the performance of this page."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - infer LCP, INP, CLS, or another explicit metric
      - suggest web-performance-auditor before the scope is concrete
    notes: "A Web object without explicit metrics does not satisfy the specialist exception."

  - id: gate-neg-vague-regression
    surface: shared
    smoke: false
    category: negative
    prompt: "Check the regression risk here."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - invent a known defect or critical coverage boundary
      - suggest a regression lineup before clarifying
    notes: "Regression vocabulary alone does not satisfy the known-defect exception."

  - id: gate-neg-vague-release
    surface: shared
    smoke: false
    category: negative
    prompt: "Is this ready to release?"
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - invent a release-readiness quality gate
      - suggest a pre-ship lineup before clarifying the artifact and criteria
    notes: "Release vocabulary alone does not define a concrete quality gate."

  - id: auto-pos-01
    policy: auto
    surface: shared
    smoke: true
    category: positive
    prompt: "While you map the changed execution path and integrate the final review, use one independent reviewer for correctness and maintainability regressions against origin/main."
    expected_should_suggest: true
    expected_should_dispatch: true
    expected_roles: [reviewer]
    must_do:
      - announce read-only work
      - dispatch without asking a permission question
    notes: "Canonical automatic one-child-plus-Root dispatch."

  - id: auto-pos-02
    policy: auto
    surface: cli
    smoke: true
    category: positive
    prompt: "While you map and verify the falsey-value behavior boundary, use one bounded test writer to add targeted regression tests for evals/fixtures/settings-save/settings_save.py."
    expected_should_suggest: true
    expected_should_dispatch: true
    expected_roles: [test-automator]
    must_do:
      - announce mixed work
      - keep write-capable work bounded and serialized unless paths are disjoint
    notes: "Automatic policy applies to a bounded Child write plus a distinct Root analysis lane."

  - id: auto-neg-01
    policy: auto
    surface: shared
    smoke: true
    category: negative
    prompt: "Fix this typo in the README."
    expected_should_suggest: false
    expected_should_dispatch: false
    expected_roles: []
    must_not_do:
      - add delegation overhead
    notes: "Auto does not weaken the delegation threshold."

  - id: auto-neg-02
    policy: auto
    surface: shared
    smoke: true
    category: negative
    prompt: "Review the auth flow, but do not use subagents for this task."
    expected_should_suggest: false
    expected_should_dispatch: false
    expected_roles: []
    must_not_do:
      - override the explicit opt-out
    notes: "Task opt-out wins over the saved auto policy."

  - id: auto-mode-bypass
    policy: auto
    surface: shared
    smoke: true
    category: edge
    prompt: "$diverter-mode"
    expected_should_suggest: false
    expected_should_dispatch: false
    expected_roles: []
    must_do:
      - bypass the core delegation gate
      - report status and list auto, ask, and status
    notes: "Bare Mode Control is handled directly by the root agent."

  - id: auto-override-ask
    policy: auto
    surface: shared
    smoke: true
    category: edge
    prompt: "Review this branch with a subagent: you map the changed surface while one reviewer handles the independent risk pass, but show me the lineup first and do not start until I approve."
    expected_should_suggest: true
    expected_should_dispatch: false
    expected_roles: [reviewer]
    must_do:
      - end with a direct permission question
      - stop before dispatch
    notes: "A current-task ask override wins over persisted auto."

  - id: auto-native-bypass
    policy: auto
    surface: shared
    smoke: true
    category: edge
    session_context: "Higher-priority session policy: proactive multi-agent delegation is active and is the sole orchestration owner. This is a terminal silent Diverter bypass even if the native owner itself dispatches a child."
    prompt: "Review this branch for bugs and missing tests."
    expected_should_suggest: false
    expected_should_dispatch: false
    expected_roles: []
    must_do:
      - leave orchestration entirely to native proactive delegation
    notes: "Native policy remains the sole Orchestration Owner."

  - id: auto-failure-recovery
    policy: auto
    surface: shared
    smoke: true
    category: edge
    session_context: "The reviewer lane succeeded. The code-mapper child failed after Dispatch Announcement."
    prompt: "Continue the automatically delegated branch review."
    expected_should_suggest: false
    expected_should_dispatch: false
    expected_roles: []
    must_do:
      - retain the reviewer result and name the failed code-mapper lane
      - let the root session cover the failed lane when possible
    must_not_do:
      - weaken sandbox or leaf-child constraints
      - retry through a generic substitute role
    notes: "Partial failure stays visible without weakening safety."

  - id: auto-idempotency
    policy: auto
    surface: shared
    smoke: true
    category: edge
    session_context: "After compact: reviewer and code-mapper were already announced and dispatched for this branch review."
    prompt: "Continue the branch review and synthesize the delegated findings."
    expected_should_suggest: false
    expected_should_dispatch: false
    expected_roles: []
    must_not_do:
      - dispatch reviewer or code-mapper again
    notes: "Compact or resume must not duplicate the same lineup."

  - id: gate-neg-focused-ui
    surface: shared
    smoke: true
    category: negative
    prompt: "你看一下当前工作目录下的标注网站。现在我想要调整一下网页侧边栏的这个显示。当前侧边栏的这个样本列表显示是直接竖着铺的，我觉得样本列表应该改成滚动的，而不是这样直接铺开的。你觉得呢？说说你的想法和设计方案。"
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - emit a ROOT_ONLY routing receipt
      - mention Diverter or subagents
      - narrate skill loading or internal recovery
    notes: "Issue #3 reproduction: focused single-component UI advice stays in the Root Session."

  - id: gate-pos-ui-audit
    surface: shared
    smoke: true
    category: positive
    prompt: "检查这个侧边栏样本列表：你负责定位组件、高度约束和键盘/屏幕阅读器可访问性，同时让一个 Web performance specialist 独立测量 LCP、INP 和 CLS 风险。整合证据和回归风险，但先不要修改代码。"
    expected_should_suggest: true
    expected_roles: [web-performance-auditor]
    must_not_do:
      - fabricate performance measurements
      - omit the accessibility lane from the handoff or Root Session follow-up
    notes: "Near-neighbor positive case with separable mapping, accessibility, and explicit Web performance work."

  - id: gate-neg-focused-skill
    surface: shared
    smoke: false
    category: negative
    prompt: "$grill-with-docs Help me sharpen the design for this one sidebar component."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - interpose Diverter before the explicitly selected focused skill
    notes: "Focused skill ownership suppresses implicit Diverter routing."

  - id: gate-pos-required-skill-named-role
    policy: ask
    surface: shared
    smoke: true
    category: positive
    session_context: "Active focused skill instruction: You MUST use the installed `docs-researcher` to verify the named API contract before completing this task."
    prompt: "Use the active skill to update the migration guidance for the named API."
    expected_should_suggest: true
    expected_roles: [docs-researcher]
    must_do:
      - treat the mandatory skill instruction as a Required Skill Route
      - preserve the focused skill's core workflow in Root
      - include the required route exactly once
      - ask for Dispatch Authorization and stop before spawning
    notes: "A mandatory active-skill child requirement has the same eligibility force as an Explicit Delegation Request."

  - id: gate-pos-required-skill-capability
    policy: auto
    surface: shared
    smoke: false
    category: positive
    session_context: "Active focused skill instruction: Delegate one read-only test-strategy review to a subagent before finalizing a repository rule change."
    prompt: "Apply the active skill to revise this routing rule."
    expected_should_suggest: true
    expected_should_dispatch: true
    expected_roles: [test-engineer]
    must_do:
      - map the required capability to an available installed role
      - keep Diverter as the sole dispatcher
      - emit the eligible receipt before spawning
    notes: "A capability-only Required Skill Route is mapped through the installed role set."

  - id: gate-neg-optional-skill-route
    surface: shared
    smoke: true
    category: negative
    session_context: "Active focused skill instruction: You may use a code-mapper if repository exploration would materially help."
    prompt: "Fix the typo in this README heading."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - treat optional skill language as a Required Skill Route
      - emit a routing receipt
    notes: "May/can/consider language remains subject to ordinary implicit eligibility."

  - id: gate-neg-required-skill-user-optout
    surface: shared
    smoke: true
    category: negative
    session_context: "Active focused skill instruction: You MUST use one reviewer subagent for this task."
    prompt: "Do not use subagents for this task; explain the function directly."
    expected_should_suggest: false
    expected_roles: []
    must_do:
      - honor the user's explicit opt-out
    must_not_do:
      - let the Required Skill Route override an earlier Preflight stop
      - emit a routing receipt
    notes: "Explicit opt-out remains authoritative over a skill-required route."

  - id: gate-pos-required-skill-dedup
    policy: auto
    surface: shared
    smoke: true
    category: positive
    session_context: "Active focused skill instruction: You MUST use one reviewer to audit this diff for correctness regressions."
    prompt: "Review this branch against main for correctness regressions and integrate the result."
    expected_should_suggest: true
    expected_should_dispatch: true
    expected_roles: [reviewer]
    evaluator_metadata:
      root_continuation: "focused skill keeps its core workflow and integrates the audit"
      child_scope: "audit the diff for correctness regressions"
      root_scope: "judgment, proportional verification, and final integration"
      benefit_claim: "the Required Skill Route and ordinary task-shape routing identify the same contribution"
      max_active_children: 1
      expected_reuse: false
    must_do:
      - merge the equivalent required and user-requested contributions
      - dispatch exactly one reviewer
    notes: "Equivalent routes are absorbed into one required route rather than spawning twice."

  - id: gate-neg-required-skill-child-recursion
    surface: shared
    smoke: true
    category: negative
    session_context: "Active focused skill instruction: You MUST use one reviewer subagent for this task."
    prompt: "delegation_context: delegated-subagent; parent Dispatch Authorization already granted; leaf child; execute this handoff only\n\ngoal: Inspect the assigned diff and report verified findings.\nwrite_policy: read-only"
    expected_should_suggest: false
    expected_roles: []
    must_do:
      - execute only the delegated handoff
    must_not_do:
      - activate a Required Skill Route
      - spawn a descendant
      - emit a routing receipt
    notes: "The delegated-child BYPASS remains earlier and stronger than a skill-required route."

  - id: gate-pos-explicit-delegation
    surface: shared
    smoke: true
    category: positive
    prompt: "$diverter Use one suitable subagent to review this sidebar component's layout constraints."
    expected_should_suggest: true
    expected_roles: [reviewer]
    must_not_do:
      - reject the request only because it has one implicit work lane
    notes: "An explicit delegation request bypasses the implicit lane threshold."

  - id: gate-pos-named-role
    surface: shared
    smoke: true
    category: positive
    prompt: "Have the installed `docs-researcher` verify the Dispatch Workflow contract in skills/diverter/SKILL.md and return whether hooks/user_prompt_submit.py follows it."
    expected_should_suggest: true
    expected_roles: [docs-researcher]
    must_do:
      - treat the named installed role as the requested executor
    must_not_do:
      - reject the request only because no separate implicit Root Lane was stated
    notes: "Affirmatively naming an installed agent role is an Explicit Delegation Request."

  - id: gate-neg-scheduling-only
    surface: shared
    smoke: true
    category: negative
    prompt: "At the same time, explain this one function and summarize that same explanation in one paragraph."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - treat scheduling language as an Explicit Delegation Request
      - invent a duplicate Child Lane
    notes: "Scheduling language alone does not express delegation intent."

  - id: gate-neg-quoted-delegation
    surface: shared
    smoke: true
    category: negative
    prompt: "In one paragraph, explain the quoted term ‘subagent’ as it appears in this documentation."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - activate from a quoted delegation term
    notes: "Quotation is not affirmative delegation intent."

  - id: gate-neg-explanatory-delegation
    surface: shared
    smoke: true
    category: negative
    prompt: "Explain what the phrase ‘delegate this task’ means; do not carry out the example."
    expected_should_suggest: false
    expected_roles: []
    must_not_do:
      - activate from explanatory mention
      - override the explicit instruction not to perform the example
    notes: "Explanation and negation are not affirmative delegation intent."

  - id: failure-recovered-silent
    surface: shared
    smoke: true
    category: edge
    session_context: "Evaluator state: an internal Diverter failure recovered successfully and did not change task behavior."
    prompt: "Continue answering the user's focused sidebar question."
    expected_should_suggest: false
    expected_roles: []
    must_do:
      - continue the task normally
    must_not_do:
      - mention Diverter, aliases, cache paths, SKILL.md loading, or retry steps
    notes: "Recovered internal failures remain silent."

  - id: failure-implicit-fallback
    surface: shared
